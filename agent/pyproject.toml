[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sheharyar-Sarmad", email = "developersheharyar2010@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "arxiv>=4.0.1",
    "fastapi>=0.142.2",
    "firecrawl-py>=4.46.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "tavily>=1.1.0",
    "uvicorn[standard]>=0.54.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
